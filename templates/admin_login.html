{% extends "base.html" %}

{% block title %}Admin Login — Prayaas | Administration{% endblock %}
{% block meta_desc %}Admin login for Prayaas internship matching system administration panel.{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-center" style="min-height:70vh;padding:3rem 0;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div style="position:absolute;top:50%;left:50%;width:300px;height:300px;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(var(--violet-rgb),.1) 0%,transparent 70%);pointer-events:none;border-radius:50%;filter:blur(50px);"></div>
                
                <div class="card card-glow " style="position:relative;">
                    <div class="card-body p-4">
                        <div class="text-center mb-4">
                            <div style="width:64px;height:64px;border-radius:18px;background:rgba(var(--violet-rgb),.1);border:1px solid rgba(var(--violet-rgb),.2);display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;">
                                <i class="fas fa-shield-alt" style="color:var(--violet);font-size:1.5rem;"></i>
                            </div>
                            <h3 style="font-size:1.375rem;margin-bottom:.25rem;">Admin Access</h3>
                            <p style="color:var(--gray-3);font-size:.875rem;margin:0;">Authorized personnel only</p>
                        </div>
                        
                        <form method="POST">
                            <div class="mb-3">
                                <label for="email" class="form-label">
                                    <i class="fas fa-envelope me-1" style="font-size:.75rem;"></i>Email
                                </label>
                                <input type="email" class="form-control" id="email" name="email" 
                                       placeholder="admin@example.com" required>
                            </div>
                            
                            <div class="mb-4">
                                <label for="password" class="form-label">
                                    <i class="fas fa-lock me-1" style="font-size:.75rem;"></i>Password
                                </label>
                                <input type="password" class="form-control" id="password" name="password" 
                                       placeholder="••••••••" required>
                            </div>
                            
                            <button type="submit" class="btn w-100 btn-glow" 
                                    style="background:var(--grad-brand);color:#fff;">
                                <i class="fas fa-sign-in-alt me-2"></i>Access Dashboard
                            </button>
                        </form>
                        
                        <div class="text-center mt-3">
                            <a href="{{ url_for('index') }}" style="color:var(--gray-4);font-size:.8125rem;">
                                <i class="fas fa-arrow-left me-1"></i>Back to Home
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
